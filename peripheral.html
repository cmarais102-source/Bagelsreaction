<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peripheral Awareness Test</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0b1a16;
        color: white;
        text-align: center;
        margin: 0;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #focus-point {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 10px;
        height: 10px;
        background-color: rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        z-index: 0;
    }

    .home-button {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: #00ffcc;
        color: black;
        padding: 10px 15px;
        text-decoration: none;
        font-weight: bold;
        border-radius: 8px;
        z-index: 1000;
    }

    h1 { margin-top: 30px; font-size: 1.5rem; opacity: 0.7; }

    #colorBox {
        position: absolute;
        display: none;
        border-radius: 4px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        z-index: 10;
    }

    #ui-layer { position: relative; z-index: 20; pointer-events: none; }

    #result { height: 40px; font-size: 24px; font-weight: bold; margin-top: 10px; }

    #stats {
        background: rgba(0,0,0,0.3);
        padding: 10px 20px;
        border-radius: 20px;
        margin-top: 10px;
        font-family: monospace;
    }
    
    .instruction { font-size: 0.9rem; color: #888; margin-top: 5px;}
    
    /* STOPWATCH STYLES */
    #stopwatch-container {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: #00ffcc;
        padding: 10px 15px;
        border-radius: 8px;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        border: 1px solid #00ffcc;
        z-index: 2000;
        text-align: center;
    }

    #stopwatch-display {
        font-size: 20px;
        margin-bottom: 5px;
    }

    .stopwatch-btn {
        background: transparent;
        border: 1px solid #00ffcc;
        color: #00ffcc;
        padding: 2px 8px;
        font-size: 12px;
        border-radius: 4px;
        cursor: pointer;
        margin: 0 2px;
    }

    .stopwatch-btn:hover {
        background: #00ffcc;
        color: black;
    }

    #numberDisplay {
        position: absolute;
        font-size: 70px;
        font-weight: bold;
        color: #00ffcc;
    }

    #inputBox {
        font-size: 24px;
        padding: 10px;
        width: 220px;
        text-align: center;
        display: none;
        margin-top: 120px;
    }

    #result {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
    }

    #stats {
        margin-top: 20px;
        font-size: 16px;

    /* Level Summary Overlay */
    #summary-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(11, 26, 22, 0.95);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 2000;
    }

    .summary-card {
        background: #1a2e29;
        padding: 40px;
        border-radius: 15px;
        border: 2px solid #00ffcc;
        min-width: 300px;
    }

    button {
        background: #00ffcc;
        border: none;
        padding: 15px 30px;
        font-size: 1.2rem;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
    }

    button:hover { background: #00d4aa; }
    .fail-text { color: #ff4444; margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<a href="index.html" class="home-button">🏠 Home</a>
<div id="focus-point"></div>

<div id="ui-layer">
    <h1>PERIPHERAL VISION TRAINER</h1>
    <div id="result">GET READY...</div>
    <div id="stats">Level: 1 | Round: 0/10 | Accuracy: 0%</div>
    <p class="instruction">Press: (R)ed, (B)lue, (G)reen, (Y)ellow, (O)range</p>
</div>

<div id="stopwatch-container">
    <div id="stopwatch-display">00:00:00</div>
    <button class="stopwatch-btn" onclick="startStopwatch()">Start</button>
    <button class="stopwatch-btn" onclick="stopStopwatch()">Stop</button>

<div id="colorBox"></div>

<div id="summary-overlay">
    <div class="summary-card">
        <h2 id="summary-title">Level Complete</h2>
        <p id="summary-stats"></p>
        <p id="summary-msg"></p>
        <button id="next-btn" onclick="startNextLevel()">Next Level</button>
        <button id="retry-btn" onclick="retryLevel()" style="background: #ffaa00; display: none;">Retry Level</button>
    </div>
</div>

<script>
const colors = [
    { name: "red", key: "r" },
    { name: "blue", key: "b" },
    { name: "orange", key: "o" },
    { name: "yellow", key: "y" },
    { name: "green", key: "g" }
];
// --- STOPWATCH VARIABLES ---
let startTime;
let elapsedTime = 0;
let stopwatchInterval;
let stopwatchRunning = false;
const stopwatchDisplay = document.getElementById("stopwatch-display");

// --- STOPWATCH FUNCTIONS ---
function startStopwatch() {
    if (!stopwatchRunning) {
        stopwatchRunning = true;
        startTime = Date.now() - elapsedTime;
        stopwatchInterval = setInterval(updateTime, 10);
    }
}

function stopStopwatch() {
    if (stopwatchRunning) {
        stopwatchRunning = false;
        clearInterval(stopwatchInterval);
    }
}

function updateTime() {
    elapsedTime = Date.now() - startTime;
    stopwatchDisplay.textContent = formatTime(elapsedTime);
}

function formatTime(time) {
    let milliseconds = Math.floor((time % 1000) / 10);
    let seconds = Math.floor((time / 1000) % 60);
    let minutes = Math.floor((time / (1000 * 60)) % 60);

    return (
        (minutes < 10 ? "0" + minutes : minutes) + ":" +
        (seconds < 10 ? "0" + seconds : seconds) + ":" +
        (milliseconds < 10 ? "0" + milliseconds : milliseconds)
    );
}

// Game State
let level = 1;
let totalCorrect = 0;
let totalAttempts = 0;
let roundsPerLevel = 10;
let canInput = false;
let currentColor = null;
let timeoutTracker = null;

let config = {
    displayTime: 600,    
    responseTimeLimit: 600, // 0.6 seconds limit
    boxSize: 180,        
    spawnDelay: 1000 
};

const box = document.getElementById("colorBox");
const resultEl = document.getElementById("result");
const statsEl = document.getElementById("stats");
const summaryOverlay = document.getElementById("summary-overlay");

function updateStats() {
    const acc = totalAttempts ? Math.round((totalCorrect / totalAttempts) * 100) : 0;
    statsEl.innerHTML = `Level: ${level} | Round: ${totalAttempts}/${roundsPerLevel} | Accuracy: ${acc}%`;
}

function spawnColor() {
    if (totalAttempts >= roundsPerLevel) {
        showSummary();
        return;
    }

    canInput = false;
    resultEl.textContent = "WATCH...";
    resultEl.style.color = "white";

    currentColor = colors[Math.floor(Math.random() * colors.length)];
    box.style.width = config.boxSize + "px";
    box.style.height = config.boxSize + "px";
    box.style.backgroundColor = currentColor.name;

    const padding = 50;
    const maxX = window.innerWidth - config.boxSize - padding;
    const maxY = window.innerHeight - config.boxSize - padding;
    box.style.left = (Math.random() * maxX + padding/2) + "px";
    box.style.top = (Math.random() * maxY + padding/2) + "px";

    setTimeout(() => {
        box.style.display = "block";
        
        setTimeout(() => {
            box.style.display = "none";
            canInput = true;
            resultEl.textContent = "TYPE NOW! (0.6s)";
            
            // Start the 0.6s countdown
            timeoutTracker = setTimeout(() => {
                if (canInput) {
                    handleInput({ key: "timeout" }); 
                }
            }, config.responseTimeLimit);

        }, config.displayTime);
    }, 500); 
}

function handleInput(e) {
    if (!canInput) return;
    
    clearTimeout(timeoutTracker);
    canInput = false;
    totalAttempts++;

    const keyPressed = e.key.toLowerCase();
    const isCorrect = keyPressed === currentColor.key;
    
    if (keyPressed === "timeout") {
        resultEl.textContent = "⏱ TOO SLOW!";
        resultEl.style.color = "#ff4444";
    } else if (isCorrect) {
        totalCorrect++;
        resultEl.textContent = "✔ CORRECT";
        resultEl.style.color = "#00ffcc";
    } else {
        resultEl.textContent = "✘ WRONG KEY";
        resultEl.style.color = "#ff4444";
    }

    updateStats();
    setTimeout(spawnColor, config.spawnDelay);
}

function showSummary() {
    const accuracy = (totalCorrect / totalAttempts) * 100;
    const passed = accuracy >= 90;

    summaryOverlay.style.display = "flex";
    document.getElementById("summary-title").textContent = passed ? `Level ${level} Cleared!` : `Level ${level} Failed`;
    document.getElementById("summary-stats").innerHTML = `Accuracy: <b>${Math.round(accuracy)}%</b><br>Correct: ${totalCorrect} / ${totalAttempts}`;
    
    const msgEl = document.getElementById("summary-msg");
    const nextBtn = document.getElementById("next-btn");
    const retryBtn = document.getElementById("retry-btn");

    if (passed) {
        msgEl.innerHTML = "Great job! Your peripheral focus is sharp.";
        msgEl.className = "";
        nextBtn.style.display = "block";
        retryBtn.style.display = "none";
    } else {
        msgEl.innerHTML = "Accuracy below 90%. You must repeat this level.";
        msgEl.className = "fail-text";
        nextBtn.style.display = "none";
        retryBtn.style.display = "block";
    }
}

function startNextLevel() {
    level++;
    // Make it harder
    config.boxSize = Math.max(50, config.boxSize - 20);
    config.displayTime = Math.max(200, config.displayTime - 50);
    resetGameState();
}

function retryLevel() {
    resetGameState();
}

function resetGameState() {
    totalCorrect = 0;
    totalAttempts = 0;
    summaryOverlay.style.display = "none";
    updateStats();
    spawnColor();
}

document.addEventListener("keydown", handleInput);

// Initial Start
setTimeout(spawnColor, 1500);

// Start game and stopwatch automatically
startStopwatch();
startRound();

</script>

</body>
</html>
