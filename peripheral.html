<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peripheral Training - ELITE Discrimination</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0b1a16;
        color: white;
        text-align: center;
        margin: 0;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #focus-point {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 6px;
        height: 6px;
        background-color: rgba(0, 255, 204, 0.6);
        border-radius: 50%;
        z-index: 0;
        box-shadow: 0 0 10px #00ffcc;
    }

    #round-timer-container {
        position: fixed;
        top: 20px;
        left: 20px;
        text-align: left;
        z-index: 2000;
        color: #ff4444;
    }

    #session-stopwatch-container {
        position: fixed;
        top: 20px;
        right: 200px; 
        text-align: right;
        z-index: 2000;
        color: #00ffcc;
    }

    .label { font-size: 10px; color: #666; letter-spacing: 1px; display: block; text-transform: uppercase; }
    .timer-val { font-size: 24px; font-weight: bold; font-family: 'Courier New', monospace; }

    .home-button {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: #00ffcc;
        color: black;
        padding: 8px 15px;
        text-decoration: none;
        font-weight: bold;
        border-radius: 5px;
        z-index: 1000;
    }

    #ui-layer { margin-top: 50px; position: relative; z-index: 20; pointer-events: none; }
    #result { height: 40px; font-size: 28px; font-weight: bold; margin: 15px 0; letter-spacing: 1px; }
    
    #stats-bar {
        background: rgba(255, 255, 255, 0.05);
        padding: 12px 30px;
        border-radius: 30px;
        font-family: monospace;
        border: 1px solid rgba(0, 255, 204, 0.3);
        display: flex;
        gap: 25px;
        pointer-events: auto;
    }

    #box-container {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 10;
    }

    .colorBox {
        position: absolute;
        display: none;
        border-radius: 4px;
        box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    #start-btn {
        background: #00ffcc;
        border: none;
        padding: 20px 50px;
        font-size: 1.5rem;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        color: black;
        box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        transition: 0.2s;
        margin-top: 20px;
        pointer-events: auto;
    }

    #start-btn:hover { background: #fff; transform: scale(1.05); }

    #summary-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(5, 15, 12, 0.98);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 3000;
    }

    .summary-card {
        background: #11221e;
        padding: 50px;
        border-radius: 20px;
        border: 2px solid #00ffcc;
        text-align: center;
        min-width: 350px;
    }

    .summary-card button {
        background: #00ffcc;
        border: none;
        padding: 15px 45px;
        font-size: 1.1rem;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 25px;
        transition: 0.2s;
    }

    .summary-card button:hover { background: #fff; transform: scale(1.05); }
    .fail-text { color: #ff4444; font-weight: bold; margin-top: 15px; }
    .pass-text { color: #00ffcc; font-weight: bold; margin-top: 15px; }
    .info-text { color: white; font-size: 1.2rem; margin-bottom: 20px; line-height: 1.6; }
</style>
</head>
<body>

<a href="index.html" class="home-button">🏠 Home</a>
<div id="focus-point"></div>

<div id="round-timer-container">
    <span class="label">Round Time</span>
    <div id="round-timer-display" class="timer-val">15.00</div>
</div>

<div id="session-stopwatch-container">
    <span class="label">Total Session</span>
    <div id="session-display" class="timer-val">00:00:00</div>
</div>

<div id="ui-layer">
    <div id="result">READY</div>
    <div id="stats-bar">
        <span>LVL: <span id="lvl-val">1</span></span>
        <span>HITS: <span id="hit-val">0</span></span>
        <span>ACCURACY: <span id="acc-val">0%</span></span>
    </div>
    <p style="color: #666; font-size: 12px; margin-top: 10px;">Goal: <span id="goal-val">70</span>% Accuracy to Advance</p>
    <button id="start-btn" onclick="beginProtocol()">BEGIN TRAINING</button>
</div>

<div id="box-container"></div>

<div id="summary-overlay">
    <div class="summary-card">
        <h2 id="summary-title">ROUND ENDED</h2>
        <p id="summary-stats" style="font-size: 1.4rem; line-height: 1.8;"></p>
        <div id="summary-status-msg"></div>
        <button id="action-btn" onclick="handleAction()"></button>
    </div>
</div>

<script>
const colors = [
    { name: "red", key: "r" },
    { name: "blue", key: "b" },
    { name: "yellow", key: "y" },
    { name: "green", key: "g" }
];

let sessionStartTime = Date.now();
let sessionRunning = false;
setInterval(() => {
    if(!sessionRunning) return;
    let elapsed = Date.now() - sessionStartTime;
    let ms = Math.floor((elapsed % 1000) / 10);
    let s = Math.floor((elapsed / 1000) % 60);
    let m = Math.floor((elapsed / 60000) % 60);
    document.getElementById("session-display").textContent = 
        `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}:${ms.toString().padStart(2, '0')}`;
}, 10);

let level = 1;
let totalCorrect = 0;
let totalAttempts = 0;
let gameActive = false;
let roundTimeLeft = 15.00;
let canInput = false;
let currentColor = null; 
let targetColor = null;  
let roundTimerInterval = null;
let reactionTimeout = null;
let levelPassed = false;
let showInfoScreenNext = false;

let config = {
    boxSize: 130,          
    flashDuration: 400,    
    reactionWindow: 750,   
    passRate: 0.70,
    spawnDelay: 400,
    pairCount: 1 
};

const boxContainer = document.getElementById("box-container");
const roundDisplay = document.getElementById("round-timer-display");
const startBtn = document.getElementById("start-btn");

function updateUI() {
    document.getElementById("lvl-val").textContent = level;
    document.getElementById("hit-val").textContent = totalCorrect;
    const acc = totalAttempts ? Math.round((totalCorrect / totalAttempts) * 100) : 0;
    document.getElementById("acc-val").textContent = acc + "%";
    document.getElementById("goal-val").textContent = Math.round(config.passRate * 100);
}

function beginProtocol() {
    startBtn.style.display = 'none';
    sessionRunning = true;
    startRound();
}

function startRound() {
    totalCorrect = 0;
    totalAttempts = 0;
    roundTimeLeft = 15.00;
    gameActive = true;
    updateUI();
    
    roundTimerInterval = setInterval(() => {
        roundTimeLeft -= 0.01;
        roundDisplay.textContent = roundTimeLeft.toFixed(2);
        if (roundTimeLeft <= 0) endRound();
    }, 10);

    spawnColor();
}

function spawnColor() {
    if (!gameActive) return;

    canInput = false;
    boxContainer.innerHTML = ''; 

    if (level < 4) {
        currentColor = colors[Math.floor(Math.random() * colors.length)];
        createBox(currentColor.name, config.boxSize);
    } else {
        const allColors = [...colors];
        const targetIdx = Math.floor(Math.random() * allColors.length);
        targetColor = allColors[targetIdx];
        createBox(targetColor.name, config.boxSize);
        allColors.splice(targetIdx, 1); 

        for (let i = 0; i < config.pairCount; i++) {
            const fillerIdx = Math.floor(Math.random() * allColors.length);
            const fillerColor = allColors[fillerIdx];
            createBox(fillerColor.name, config.boxSize);
            createBox(fillerColor.name, config.boxSize);
            allColors.splice(fillerIdx, 1); 
        }
    }

    setTimeout(() => {
        if (!gameActive) return;
        const boxes = document.querySelectorAll('.colorBox');
        boxes.forEach(b => b.style.display = 'block');
        
        setTimeout(() => {
            const boxes = document.querySelectorAll('.colorBox');
            boxes.forEach(b => b.style.display = 'none');
            canInput = true;
            
            reactionTimeout = setTimeout(() => {
                if (canInput) handleInput({ key: "timeout" });
            }, config.reactionWindow);

        }, config.flashDuration);
    }, config.spawnDelay);
}

function createBox(colorName, size) {
    const box = document.createElement('div');
    box.className = 'colorBox';
    box.style.width = size + 'px';
    box.style.height = size + 'px';
    box.style.backgroundColor = colorName;

    const pad = 150;
    const maxX = window.innerWidth - size - pad;
    const maxY = window.innerHeight - size - pad;
    box.style.left = (Math.random() * maxX + pad/2) + 'px';
    box.style.top = (Math.random() * maxY + pad/2) + 'px';
    
    boxContainer.appendChild(box);
}

function handleInput(e) {
    if (!canInput || !gameActive) return;
    
    clearTimeout(reactionTimeout);
    canInput = false;
    totalAttempts++;

    const key = e.key.toLowerCase();
    const resultEl = document.getElementById("result");
    
    const correctKey = (level < 4) ? currentColor.key : targetColor.key;

    if (key === correctKey) {
        totalCorrect++;
        resultEl.textContent = "HIT";
        resultEl.style.color = "#00ffcc";
    } else {
        resultEl.textContent = key === "timeout" ? "MISSED" : "ERROR";
        resultEl.style.color = "#ff4444";
    }

    updateUI();
    spawnColor();
}

function endRound() {
    gameActive = false;
    clearInterval(roundTimerInterval);
    clearTimeout(reactionTimeout);
    boxContainer.innerHTML = '';
    roundDisplay.textContent = "0.00";

    const accuracy = totalAttempts ? totalCorrect / totalAttempts : 0;
    levelPassed = accuracy >= config.passRate;

    const overlay = document.getElementById("summary-overlay");
    overlay.style.display = "flex";
    
    document.getElementById("summary-stats").innerHTML = 
        `LEVEL ${level}<br>Hits: ${totalCorrect}<br>Accuracy: ${Math.round(accuracy * 100)}%`;

    const msg = document.getElementById("summary-status-msg");
    const btn = document.getElementById("action-btn");

    if (levelPassed) {
        msg.innerHTML = `<p class="pass-text">PHASE CLEAR. Advancing...</p>`;
        btn.textContent = "Level " + (level + 1);
        showInfoScreenNext = (level === 3); 
    } else {
        msg.innerHTML = `<p class="fail-text">INSUFFICIENT ACCURACY. Goal: ${Math.round(config.passRate*100)}%</p>`;
        btn.textContent = "Retry Level " + level;
        showInfoScreenNext = false;
    }
}

function handleAction() {
    if (levelPassed) {
        level++;
        
        if (level === 2) {
            config.boxSize = 100;
            config.reactionWindow = 650;
        } else if (level === 3) {
            config.boxSize = 80;
            config.reactionWindow = 550;
            config.flashDuration = 300;
        } else if (level === 4) {
            config.pairCount = 1; 
            config.boxSize = 100;
            config.flashDuration = 500;
            config.reactionWindow = 1200;
            config.spawnDelay = 500;
        } else if (level === 5) {
            config.pairCount = 2; 
            config.boxSize = 80;
            config.flashDuration = 400;
            config.reactionWindow = 1000;
        } else if (level > 5) {
            config.pairCount = Math.min(4, config.pairCount + 1);
            config.boxSize = Math.max(30, config.boxSize - 10);
            config.flashDuration = Math.max(150, config.flashDuration - 50);
            config.reactionWindow = Math.max(500, config.reactionWindow - 100);
        }
        
        config.passRate = Math.min(0.98, config.passRate + 0.05);
    }
    
    document.getElementById("summary-overlay").style.display = "none";
    
    if (showInfoScreenNext) {
        showInfoScreen();
    } else {
        startRound();
    }
}

function showInfoScreen() {
    const overlay = document.getElementById("summary-overlay");
    overlay.style.display = "flex";
    document.getElementById("summary-title").textContent = "PROTOCOL CHANGE";
    document.getElementById("summary-stats").innerHTML = "<p class='info-text'>Now multiple coloured boxes will appear.<br><br><b>Click the colour that only has one box.</b></p>";
    document.getElementById("summary-status-msg").innerHTML = "";
    document.getElementById("action-btn").textContent = "Begin Discrimination Phase";
    showInfoScreenNext = false; 
}

document.addEventListener("keydown", handleInput);
</script>
</body>
</html>
