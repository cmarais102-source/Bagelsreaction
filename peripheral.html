<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peripheral Awareness Test</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0b1a16;
        color: white;
        text-align: center;
        margin: 0;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Focus Point to keep eyes centered */
    #focus-point {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 10px;
        height: 10px;
        background-color: rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        z-index: 0;
    }

    .home-button {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: #00ffcc;
        color: black;
        padding: 10px 15px;
        text-decoration: none;
        font-weight: bold;
        border-radius: 8px;
        z-index: 1000;
    }

    h1 { margin-top: 30px; font-size: 1.5rem; opacity: 0.7; }

    #colorBox {
        position: absolute;
        display: none;
        border-radius: 4px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        z-index: 10;
    }

    #ui-layer {
        position: relative;
        z-index: 20;
        pointer-events: none;
    }

    #result {
        height: 40px;
        font-size: 24px;
        font-weight: bold;
        margin-top: 10px;
    }

    #stats {
        background: rgba(0,0,0,0.3);
        padding: 10px 20px;
        border-radius: 20px;
        margin-top: 10px;
        font-family: monospace;
    }
    
    .instruction { font-size: 0.9rem; color: #888; margin-top: 5px;}
</style>
</head>
<body>

<a href="index.html" class="home-button">🏠 Home</a>
<div id="focus-point"></div>

<div id="ui-layer">
    <h1>PERIPHERAL VISION TRAINER</h1>
    <div id="result">GET READY...</div>
    <div id="stats">Level: 1 | Streak: 0 | Accuracy: 0%</div>
    <p class="instruction">Press the first letter: (R)ed, (B)lue, (G)reen, (Y)ellow, (O)range</p>
</div>

<div id="colorBox"></div>

<script>
const colors = [
    { name: "red", key: "r" },
    { name: "blue", key: "b" },
    { name: "orange", key: "o" },
    { name: "yellow", key: "y" },
    { name: "green", key: "g" }
];

// Game State
let level = 1;
let correctStreak = 0;
let totalCorrect = 0;
let totalAttempts = 0;
let canInput = false;
let currentColor = null;

// Difficulty Settings (Scalable)
let config = {
    displayTime: 600,    // How long color stays visible
    boxSize: 180,        // Size of the square
    nextRoundDelay: 1200 // Time between rounds
};

const box = document.getElementById("colorBox");
const resultEl = document.getElementById("result");
const statsEl = document.getElementById("stats");

function updateStats() {
    const acc = totalAttempts ? Math.round((totalCorrect / totalAttempts) * 100) : 0;
    statsEl.innerHTML = `Level: ${level} | Streak: ${correctStreak} | Accuracy: ${acc}% | Speed: ${config.displayTime}ms`;
}

function spawnColor() {
    canInput = false;
    resultEl.textContent = "WATCH...";
    resultEl.style.color = "white";

    // Select color
    currentColor = colors[Math.floor(Math.random() * colors.length)];
    
    // Set size and color
    box.style.width = config.boxSize + "px";
    box.style.height = config.boxSize + "px";
    box.style.backgroundColor = currentColor.name;

    // Position (ensure it stays on screen)
    const padding = 50;
    const maxX = window.innerWidth - config.boxSize - padding;
    const maxY = window.innerHeight - config.boxSize - padding;
    box.style.left = (Math.random() * maxX + padding/2) + "px";
    box.style.top = (Math.random() * maxY + padding/2) + "px";

    // The Flash
    setTimeout(() => {
        box.style.display = "block";
        
        setTimeout(() => {
            box.style.display = "none";
            canInput = true;
            resultEl.textContent = "TYPE NOW!";
        }, config.displayTime);
        
    }, 500); 
}

function handleInput(e) {
    if (!canInput) return;
    
    const keyPressed = e.key.toLowerCase();
    const isCorrect = keyPressed === currentColor.key;
    
    canInput = false; // Only one guess per flash
    totalAttempts++;

    if (isCorrect) {
        totalCorrect++;
        correctStreak++;
        resultEl.textContent = "✔ CORRECT";
        resultEl.style.color = "#00ffcc";
        
        // Level up every 3 correct answers
        if (correctStreak % 3 === 0) {
            levelUp();
        }
    } else {
        correctStreak = 0;
        resultEl.textContent = "✘ WRONG / LATE";
        resultEl.style.color = "#ff4444";
    }

    updateStats();
    
    // Trigger next round automatically
    setTimeout(spawnColor, config.nextRoundDelay);
}

function levelUp() {
    level++;
    config.displayTime = Math.max(100, config.displayTime - 60); // Faster flash
    config.boxSize = Math.max(40, config.boxSize - 15);         // Smaller target
    config.nextRoundDelay = Math.max(500, config.nextRoundDelay - 100); // Faster pace
    resultEl.textContent = "⚡ LEVEL UP! ⚡";
}

// Listen for keys
document.addEventListener("keydown", handleInput);

// Start game
setTimeout(spawnColor, 1500);
</script>

</body>
</html>
