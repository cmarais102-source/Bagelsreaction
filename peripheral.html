<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peripheral Training - Time Attack</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0b1a16;
        color: white;
        text-align: center;
        margin: 0;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #focus-point {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 8px;
        height: 8px;
        background-color: rgba(0, 255, 204, 0.4);
        border-radius: 50%;
        z-index: 0;
    }

    /* TOP LEFT: ROUND COUNTDOWN */
    #round-timer-container {
        position: fixed;
        top: 20px;
        left: 20px;
        text-align: left;
        z-index: 2000;
        color: #ff4444;
    }

    /* TOP RIGHT: SESSION STOPWATCH */
    #session-stopwatch-container {
        position: fixed;
        top: 20px;
        right: 120px; /* Shifted left to avoid home button overlap */
        text-align: right;
        z-index: 2000;
        color: #00ffcc;
    }

    .label { font-size: 10px; color: #666; letter-spacing: 1px; display: block; text-transform: uppercase; }
    .timer-val { font-size: 24px; font-weight: bold; font-family: 'Courier New', monospace; }

    .home-button {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: #00ffcc;
        color: black;
        padding: 8px 15px;
        text-decoration: none;
        font-weight: bold;
        border-radius: 5px;
        z-index: 1000;
    }

    #ui-layer { margin-top: 50px; position: relative; z-index: 20; pointer-events: none; }
    #result { height: 40px; font-size: 28px; font-weight: bold; margin: 15px 0; }
    
    #stats-bar {
        background: rgba(255, 255, 255, 0.05);
        padding: 12px 30px;
        border-radius: 30px;
        font-family: monospace;
        border: 1px solid rgba(0, 255, 204, 0.2);
        display: flex;
        gap: 25px;
    }

    #colorBox {
        position: absolute;
        display: none;
        border-radius: 6px;
        box-shadow: 0 0 25px rgba(0,0,0,0.6);
        z-index: 10;
    }

    #summary-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(5, 15, 12, 0.98);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 3000;
    }

    .summary-card {
        background: #11221e;
        padding: 50px;
        border-radius: 20px;
        border: 2px solid #00ffcc;
        text-align: center;
        min-width: 350px;
    }

    .summary-card button {
        background: #00ffcc;
        border: none;
        padding: 15px 45px;
        font-size: 1.1rem;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 25px;
        transition: 0.2s;
    }

    .summary-card button:hover { background: #fff; transform: scale(1.05); }
    .fail-text { color: #ff4444; font-weight: bold; margin-top: 15px; }
    .pass-text { color: #00ffcc; font-weight: bold; margin-top: 15px; }
</style>
</head>
<body>

<a href="index.html" class="home-button">🏠 Home</a>
<div id="focus-point"></div>

<div id="round-timer-container">
    <span class="label">Round Time</span>
    <div id="round-timer-display" class="timer-val">20.00</div>
</div>

<div id="session-stopwatch-container">
    <span class="label">Total Session</span>
    <div id="session-display" class="timer-val">00:00:00</div>
</div>

<div id="ui-layer">
    <div id="result">INITIALIZING...</div>
    <div id="stats-bar">
        <span>LVL: <span id="lvl-val">1</span></span>
        <span>HITS: <span id="hit-val">0</span></span>
        <span>ACCURACY: <span id="acc-val">0%</span></span>
    </div>
    <p style="color: #666; font-size: 12px; margin-top: 10px;">Goal: <span id="goal-val">70</span>% Accuracy to Advance</p>
</div>

<div id="colorBox"></div>

<div id="summary-overlay">
    <div class="summary-card">
        <h2 id="summary-title">ROUND ENDED</h2>
        <p id="summary-stats" style="font-size: 1.4rem; line-height: 1.8;"></p>
        <div id="summary-status-msg"></div>
        <button id="action-btn" onclick="handleAction()"></button>
    </div>
</div>

<script>
const colors = [
    { name: "red", key: "r" },
    { name: "blue", key: "b" },
    { name: "orange", key: "o" },
    { name: "yellow", key: "y" },
    { name: "green", key: "g" }
];

// Session Stopwatch State
let sessionStartTime = Date.now();
setInterval(() => {
    let elapsed = Date.now() - sessionStartTime;
    let ms = Math.floor((elapsed % 1000) / 10);
    let s = Math.floor((elapsed / 1000) % 60);
    let m = Math.floor((elapsed / 60000) % 60);
    document.getElementById("session-display").textContent = 
        `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}:${ms.toString().padStart(2, '0')}`;
}, 10);

// Game State
let level = 1;
let totalCorrect = 0;
let totalAttempts = 0;
let gameActive = false;
let roundTimeLeft = 20.00;
let canInput = false;
let currentColor = null;
let roundTimerInterval = null;
let reactionTimeout = null;
let levelPassed = false;

// Starting Difficulty
let config = {
    boxSize: 140,
    flashDuration: 400,
    reactionWindow: 700, // Starts at 0.7s
    passRate: 0.70       // Starts at 70%
};

const box = document.getElementById("colorBox");
const roundDisplay = document.getElementById("round-timer-display");

function updateUI() {
    document.getElementById("lvl-val").textContent = level;
    document.getElementById("hit-val").textContent = totalCorrect;
    const acc = totalAttempts ? Math.round((totalCorrect / totalAttempts) * 100) : 0;
    document.getElementById("acc-val").textContent = acc + "%";
    document.getElementById("goal-val").textContent = Math.round(config.passRate * 100);
}

function startRound() {
    totalCorrect = 0;
    totalAttempts = 0;
    roundTimeLeft = 20.00;
    gameActive = true;
    updateUI();
    
    roundTimerInterval = setInterval(() => {
        roundTimeLeft -= 0.01;
        roundDisplay.textContent = roundTimeLeft.toFixed(2);
        if (roundTimeLeft <= 0) endRound();
    }, 10);

    spawnColor();
}

function spawnColor() {
    if (!gameActive) return;

    canInput = false;
    currentColor = colors[Math.floor(Math.random() * colors.length)];

    box.style.width = config.boxSize + "px";
    box.style.height = config.boxSize + "px";
    box.style.backgroundColor = currentColor.name;

    const pad = 100;
    const maxX = window.innerWidth - config.boxSize - pad;
    const maxY = window.innerHeight - config.boxSize - pad;
    box.style.left = (Math.random() * maxX + pad/2) + "px";
    box.style.top = (Math.random() * maxY + pad/2) + "px";

    setTimeout(() => {
        if (!gameActive) return;
        box.style.display = "block";
        
        setTimeout(() => {
            box.style.display = "none";
            canInput = true;
            
            reactionTimeout = setTimeout(() => {
                if (canInput) handleInput({ key: "timeout" });
            }, config.reactionWindow);

        }, config.flashDuration);
    }, 500);
}

function handleInput(e) {
    if (!canInput || !gameActive) return;
    
    clearTimeout(reactionTimeout);
    canInput = false;
    totalAttempts++;

    const key = e.key.toLowerCase();
    const resultEl = document.getElementById("result");

    if (key === currentColor.key) {
        totalCorrect++;
        resultEl.textContent = "CORRECT";
        resultEl.style.color = "#00ffcc";
    } else {
        resultEl.textContent = key === "timeout" ? "TOO SLOW" : "WRONG KEY";
        resultEl.style.color = "#ff4444";
    }

    updateUI();
    spawnColor();
}

function endRound() {
    gameActive = false;
    clearInterval(roundTimerInterval);
    clearTimeout(reactionTimeout);
    box.style.display = "none";
    roundDisplay.textContent = "0.00";

    const accuracy = totalAttempts ? totalCorrect / totalAttempts : 0;
    levelPassed = accuracy >= config.passRate;

    const overlay = document.getElementById("summary-overlay");
    overlay.style.display = "flex";
    
    document.getElementById("summary-stats").innerHTML = 
        `Level ${level}<br>Successful Hits: ${totalCorrect}<br>Accuracy: ${Math.round(accuracy * 100)}%`;

    const msg = document.getElementById("summary-status-msg");
    const btn = document.getElementById("action-btn");

    if (levelPassed) {
        msg.innerHTML = `<p class="pass-text">PHASE COMPLETE. Standards Met.</p>`;
        btn.textContent = "Begin Level " + (level + 1);
    } else {
        msg.innerHTML = `<p class="fail-text">PHASE FAILED. Required Accuracy: ${Math.round(config.passRate*100)}%</p>`;
        btn.textContent = "Retry Level " + level;
    }
}

function handleAction() {
    if (levelPassed) {
        level++;
        // Scale Difficulty
        config.boxSize = Math.max(45, config.boxSize - 18);
        config.reactionWindow = Math.max(300, config.reactionWindow - 60);
        config.passRate = Math.min(0.95, config.passRate + 0.04);
    }
    document.getElementById("summary-overlay").style.display = "none";
    startRound();
}

document.addEventListener("keydown", handleInput);

// Initial start delay
setTimeout(startRound, 1500);
</script>
</body>
</html>
