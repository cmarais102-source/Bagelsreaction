<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elite Hockey Reaction Test - Pro Edition</title>
<style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background-color: #0b3d2e;
        color: white;
        text-align: center;
        overflow: hidden;
        margin: 0;
        height: 100vh;
    }

    /* HOME BUTTON */
    .home-button {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: #00ffcc;
        color: black;
        padding: 10px 15px;
        text-decoration: none;
        font-weight: bold;
        border-radius: 8px;
        transition: 0.2s ease;
        z-index: 1000;
    }
    .home-button:hover { background: white; }

    /* GLOBAL PERSISTENT STOPWATCH CSS */
    #global-timer-container {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.85);
        padding: 15px;
        border: 2px solid #00ffcc;
        border-radius: 12px;
        z-index: 9999;
        font-family: 'Courier New', monospace;
        text-align: center;
        box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
    }
    #timer-display {
        font-size: 28px;
        color: #00ffcc;
        margin-bottom: 10px;
        font-weight: bold;
    }
    .timer-btn {
        padding: 6px 12px;
        margin: 2px;
        cursor: pointer;
        font-weight: bold;
        border-radius: 6px;
        border: none;
        transition: 0.2s;
    }
    #start-stop-timer { background: #00ffcc; color: black; }
    #reset-timer { background: #ff4444; color: white; }

    /* GAME UI */
    h1 { margin-top: 60px; letter-spacing: 2px; text-transform: uppercase; }
    #level-progress {
        font-size: 18px;
        margin-top: 10px;
        color: #00ffcc;
        font-weight: bold;
    }

    #numberDisplay {
        position: absolute;
        font-size: 40px; /* Smaller as requested */
        font-weight: bold;
        color: #ffffff;
        pointer-events: none;
        z-index: 500;
    }

    #inputBox {
        font-size: 32px;
        padding: 15px;
        width: 250px;
        text-align: center;
        display: none;
        margin-top: 150px;
        border: 3px solid #00ffcc;
        border-radius: 10px;
        background: #111;
        color: white;
        outline: none;
    }

    #result { margin-top: 20px; font-size: 28px; font-weight: bold; height: 40px; }

    /* SUMMARY OVERLAY */
    #summary-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.95);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 3000;
    }
    .summary-box {
        background: #11221e;
        padding: 40px;
        border: 3px solid #00ffcc;
        border-radius: 20px;
        min-width: 350px;
    }
    .next-btn {
        background: #00ffcc;
        color: black;
        border: none;
        padding: 15px 45px;
        font-size: 22px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
    }
</style>
</head>
<body>

<div id="global-timer-container">
    <div id="timer-display">00:00:00</div>
    <button id="start-stop-timer" class="timer-btn">START</button>
    <button id="reset-timer" class="timer-btn">RESET</button>
</div>

<a href="index.html" class="home-button">🏠 Home</a>

<h1>🏑 ELITE VISION TRAINER</h1>
<div id="level-progress">LEVEL 1 | Number: 1 / 8</div>

<div id="numberDisplay"></div>

<input type="number" id="inputBox" placeholder="?" autocomplete="off">
<div id="result"></div>

<div id="summary-overlay">
    <div class="summary-box">
        <h2 id="stat-title">YOUR STATS</h2>
        <p id="stat-details"></p>
        <button id="next-btn" class="next-btn" onclick="nextLevel()">NEXT LEVEL</button>
    </div>
</div>

<script>
let level = 1;
let roundInLevel = 0;
let correctInLevel = 0;
let currentNumber = "";
let displayTime = 200; // Start at 200ms

// --- PERSISTENT STOPWATCH LOGIC ---
let timerInterval;
let isTimerRunning = false;
const timerDisplay = document.getElementById('timer-display');
const startBtn = document.getElementById('start-stop-timer');
const resetBtn = document.getElementById('reset-timer');

function updateGlobalDisplay() {
    let startTime = localStorage.getItem('globalStartTime');
    if (!startTime) {
        timerDisplay.textContent = "00:00:00";
        return;
    }
    let elapsed = Date.now() - parseInt(startTime);
    let ms = Math.floor((elapsed % 1000) / 10);
    let s = Math.floor((elapsed / 1000) % 60);
    let m = Math.floor((elapsed / 60000) % 60);
    timerDisplay.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}:${ms.toString().padStart(2,'0')}`;
}

startBtn.addEventListener('click', () => {
    if (!isTimerRunning) {
        if (!localStorage.getItem('globalStartTime')) {
            localStorage.setItem('globalStartTime', Date.now());
        }
        timerInterval = setInterval(updateGlobalDisplay, 10);
        startBtn.textContent = "STOP";
        isTimerRunning = true;
    } else {
        clearInterval(timerInterval);
        startBtn.textContent = "START";
        isTimerRunning = false;
    }
});

resetBtn.addEventListener('click', () => {
    clearInterval(timerInterval);
    localStorage.removeItem('globalStartTime');
    timerDisplay.textContent = "00:00:00";
    startBtn.textContent = "START";
    isTimerRunning = false;
});

if (localStorage.getItem('globalStartTime')) {
    isTimerRunning = true;
    startBtn.textContent = "STOP";
    timerInterval = setInterval(updateGlobalDisplay, 10);
}

// --- GAME LOGIC ---
function generateNumber() {
    let minDigits, maxDigits;
    if (level <= 3) {
        minDigits = 1; maxDigits = 2;
    } else {
        minDigits = 2; maxDigits = 4; // Level 4 onwards
    }
    const numDigits = Math.floor(Math.random() * (maxDigits - minDigits + 1)) + minDigits;
    let num = "";
    for(let i=0; i<numDigits; i++) num += Math.floor(Math.random()*10);
    return num;
}

function startRound() {
    if (roundInLevel >= 8) {
        showLevelSummary();
        return;
    }
    roundInLevel++;
    document.getElementById("level-progress").textContent = `LEVEL ${level} | Number: ${roundInLevel} / 8`;
    document.getElementById("result").textContent = "";
    document.getElementById("inputBox").value = "";
    document.getElementById("inputBox").style.display = "none";

    currentNumber = generateNumber();
    const display = document.getElementById("numberDisplay");
    display.textContent = currentNumber;
    
    // SAFE ZONE CALCULATION
    let x, y;
    const swWidth = 260, swHeight = 190; // Stopwatch area
    const titleWidth = 600, titleHeight = 160; // Title area
    const pad = 80;

    let isInsideStopwatch, isInsideTitle;

    do {
        x = Math.random() * (window.innerWidth - pad);
        y = Math.random() * (window.innerHeight - pad);

        isInsideStopwatch = (x < swWidth && y > (window.innerHeight - swHeight));
        isInsideTitle = (x > (window.innerWidth/2 - titleWidth/2) && x < (window.innerWidth/2 + titleWidth/2) && y < titleHeight);

    } while (isInsideStopwatch || isInsideTitle || y < 50);

    display.style.left = x + "px";
    display.style.top = y + "px";

    setTimeout(() => {
        display.textContent = "";
        document.getElementById("inputBox").style.display = "inline-block";
        document.getElementById("inputBox").focus();
    }, displayTime);
}

document.getElementById("inputBox").addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkAnswer();
});

function checkAnswer() {
    if (document.getElementById("inputBox").style.display === "none") return;
    const userVal = document.getElementById("inputBox").value;
    const resultEl = document.getElementById("result");
    
    if (userVal === currentNumber) {
        correctInLevel++;
        resultEl.textContent = "✔ CLEAN TOUCH";
        resultEl.style.color = "#00ffcc";
    } else {
        resultEl.textContent = `✘ TURNOVER (Was ${currentNumber})`;
        resultEl.style.color = "#ff4444";
    }
    setTimeout(startRound, 1000); 
}

function showLevelSummary() {
    const overlay = document.getElementById("summary-overlay");
    const details = document.getElementById("stat-details");
    const title = document.getElementById("stat-title");
    const btn = document.getElementById("next-btn");

    overlay.style.display = "flex";
    const pass = correctInLevel >= 6;

    if (pass) {
        title.textContent = "LEVEL COMPLETE";
        title.style.color = "#00ffcc";
        details.innerHTML = `Score: ${correctInLevel}/8<br>Current Speed: ${displayTime}ms<br><b>Status: PROMOTED</b>`;
        btn.textContent = "PROCEED";
    } else {
        title.textContent = "LEVEL FAILED";
        title.style.color = "#ff4444";
        details.innerHTML = `Score: ${correctInLevel}/8<br><i>Min. 6 required to advance.</i>`;
        btn.textContent = "RETRY LEVEL " + level;
    }
}

function nextLevel() {
    if (correctInLevel >= 6) {
        level++;
        // CUSTOM SPEED SCALING
        if (level === 2) displayTime = 180;
        else if (level === 3) displayTime = 160;
        else if (level === 4) displayTime = 160; // Transitions to 4 digits here
        else displayTime = Math.max(60, displayTime - 15); // Drop 15ms Level 5+
    }
    roundInLevel = 0;
    correctInLevel = 0;
    document.getElementById("summary-overlay").style.display = "none";
    startRound();
}

startRound();
</script>
</body>
</html>
