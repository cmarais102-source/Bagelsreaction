<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elite Hockey Reaction Test</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #0b3d2e;
        color: white;
        text-align: center;
        overflow: hidden;
        margin: 0;
    }

    /* HOME BUTTON */
    .home-button {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: #00ffcc;
        color: black;
        padding: 10px 15px;
        text-decoration: none;
        font-weight: bold;
        border-radius: 8px;
        transition: 0.2s ease;
        z-index: 1000;
    }

    .home-button:hover {
        background-color: white;
        transform: scale(1.05);
    }

    h1 {
        margin-top: 60px;
        letter-spacing: 2px;
    }

    /* STOPWATCH STYLES */
    #stopwatch-container {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: #00ffcc;
        padding: 10px 15px;
        border-radius: 8px;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        border: 1px solid #00ffcc;
        z-index: 2000;
        text-align: center;
    }

    #stopwatch-display {
        font-size: 20px;
        margin-bottom: 5px;
    }

    .stopwatch-btn {
        background: transparent;
        border: 1px solid #00ffcc;
        color: #00ffcc;
        padding: 2px 8px;
        font-size: 12px;
        border-radius: 4px;
        cursor: pointer;
        margin: 0 2px;
    }

    .stopwatch-btn:hover {
        background: #00ffcc;
        color: black;
    }

    #numberDisplay {
        position: absolute;
        font-size: 70px;
        font-weight: bold;
        color: #00ffcc;
    }

    #inputBox {
        font-size: 24px;
        padding: 10px;
        width: 220px;
        text-align: center;
        display: none;
        margin-top: 120px;
    }

    #result {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
    }

    #stats {
        margin-top: 20px;
        font-size: 16px;
    }
</style>
</head>
<body>

<div id="stopwatch-container">
    <div id="stopwatch-display">00:00:00</div>
    <button class="stopwatch-btn" onclick="startStopwatch()">Start</button>
    <button class="stopwatch-btn" onclick="stopStopwatch()">Stop</button>
</div>

<a href="index.html" class="home-button">🏠 Home</a>

<h1>🏑 ELITE VISION TRAINER</h1>

<div id="numberDisplay"></div>

<br>
<input type="text" id="inputBox" placeholder="Enter number" autocomplete="off">

<div id="result"></div>
<div id="stats"></div>

<script>
// --- GAME VARIABLES ---
let currentNumber = "";
let correctStreak = 0;
let totalCorrect = 0;
let totalAttempts = 0;
let difficultyLevel = 1;
let displayTime = 150;
let maxDigits = 2;
let inputStartTime = 0;

// --- STOPWATCH VARIABLES ---
let startTime;
let elapsedTime = 0;
let stopwatchInterval;
let stopwatchRunning = false;
const stopwatchDisplay = document.getElementById("stopwatch-display");

// --- STOPWATCH FUNCTIONS ---
function startStopwatch() {
    if (!stopwatchRunning) {
        stopwatchRunning = true;
        startTime = Date.now() - elapsedTime;
        stopwatchInterval = setInterval(updateTime, 10);
    }
}

function stopStopwatch() {
    if (stopwatchRunning) {
        stopwatchRunning = false;
        clearInterval(stopwatchInterval);
    }
}

function updateTime() {
    elapsedTime = Date.now() - startTime;
    stopwatchDisplay.textContent = formatTime(elapsedTime);
}

function formatTime(time) {
    let milliseconds = Math.floor((time % 1000) / 10);
    let seconds = Math.floor((time / 1000) % 60);
    let minutes = Math.floor((time / (1000 * 60)) % 60);

    return (
        (minutes < 10 ? "0" + minutes : minutes) + ":" +
        (seconds < 10 ? "0" + seconds : seconds) + ":" +
        (milliseconds < 10 ? "0" + milliseconds : milliseconds)
    );
}

// --- GAME FUNCTIONS ---
function generateRandomNumber() {
    const length = Math.floor(Math.random() * maxDigits) + 1;
    let number = "";
    for (let i = 0; i < length; i++) {
        number += Math.floor(Math.random() * 10);
    }
    return number;
}

function randomPosition(element) {
    const padding = 120;
    const maxX = window.innerWidth - padding;
    const maxY = window.innerHeight - padding;
    const minX = 50;
    const minY = 100;

    element.style.left = Math.random() * (maxX - minX) + minX + "px";
    element.style.top = Math.random() * (maxY - minY) + minY + "px";
}

function increaseDifficulty() {
    difficultyLevel++;
    maxDigits++;
    displayTime = Math.max(60, displayTime - 15);
}

function startRound() {
    document.getElementById("result").textContent = "";
    document.getElementById("inputBox").value = "";
    document.getElementById("inputBox").style.display = "none";

    currentNumber = generateRandomNumber();
    const display = document.getElementById("numberDisplay");

    display.textContent = currentNumber;
    randomPosition(display);

    setTimeout(() => {
        display.textContent = "";
        document.getElementById("inputBox").style.display = "inline-block";
        document.getElementById("inputBox").focus();
        inputStartTime = Date.now();
    }, displayTime);
}

function updateStats(reaction) {
    let accuracy = totalAttempts > 0 ? Math.round((totalCorrect/totalAttempts)*100) : 0;
    document.getElementById("stats").textContent =
        "Level: " + difficultyLevel +
        " | Streak: " + correctStreak +
        " | Accuracy: " + accuracy + "%" +
        " | Display: " + displayTime + "ms" +
        " | Reaction: " + reaction + "ms";
}

document.getElementById("inputBox").addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkAnswer();
});

function checkAnswer() {
    const userAnswer = document.getElementById("inputBox").value.trim();
    const reaction = Date.now() - inputStartTime;

    totalAttempts++;

    if (userAnswer === currentNumber) {
        totalCorrect++;
        correctStreak++;
        document.getElementById("result").textContent = "🔥 CLEAN TOUCH";
        document.getElementById("result").style.color = "#00ffcc";
    } else {
        correctStreak = 0;
        document.getElementById("result").textContent =
            "❌ Turnover (Was " + currentNumber + ")";
        document.getElementById("result").style.color = "red";
    }

    if (correctStreak > 0 && correctStreak % 3 === 0) {
        increaseDifficulty();
        document.getElementById("result").textContent += " | LEVEL UP ⚡";
    }

    updateStats(reaction);

    setTimeout(startRound, 800);
}

// Start game and stopwatch automatically
startStopwatch();
startRound();

</script>

</body>
</html>
