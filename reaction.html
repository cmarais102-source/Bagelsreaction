<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elite Hockey Reaction Test - Pro Edition</title>
<style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background-color: #0b3d2e;
        color: white;
        text-align: center;
        overflow: hidden;
        margin: 0;
    }

    /* HOME BUTTON */
    .home-button {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: #00ffcc;
        color: black;
        padding: 10px 15px;
        text-decoration: none;
        font-weight: bold;
        border-radius: 8px;
        transition: 0.2s ease;
        z-index: 1000;
    }

    .home-button:hover { background: white; }

    #stopwatch-container {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: #00ffcc;
        padding: 20px 30px;
        border-radius: 10px;
        font-family: 'Courier New', monospace;
        border: 1px solid #00ffcc;
        z-index: 2000;
        font-size:24px;
        font-weight:bold;
    }

    h1 { margin-top: 60px; letter-spacing: 2px; text-transform: uppercase; }

    #numberDisplay {
        position: absolute;
        font-size: 50px;
        font-weight: bold;
        color: #ffffff; /* Removed text-shadow glow */
        pointer-events: none;
    }

    #inputBox {
        font-size: 32px;
        padding: 15px;
        width: 250px;
        text-align: center;
        display: none;
        margin-top: 150px;
        border: 3px solid #00ffcc;
        border-radius: 10px;
        background: #111;
        color: white;
        outline: none;
    }

    #result { margin-top: 20px; font-size: 28px; font-weight: bold; height: 40px; }
    
    #level-progress {
        font-size: 18px;
        margin-top: 10px;
        color: #00ffcc;
        font-weight: bold;
    }

    /* SUMMARY OVERLAY */
    #summary-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.95);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 3000;
    }

    .summary-box {
        background: #11221e;
        padding: 40px;
        border: 3px solid #00ffcc;
        border-radius: 20px;
        min-width: 350px;
        box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
    }

    .summary-box h2 { color: #00ffcc; margin-top: 0; font-size: 32px; }
    .summary-box p { font-size: 22px; line-height: 1.6; margin: 20px 0; }

    .next-btn {
        background: #00ffcc;
        color: black;
        border: none;
        padding: 15px 45px;
        font-size: 22px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
    }

    .next-btn:hover { background: white; transform: scale(1.05); }
</style>
</head>
<body>

<div id="stopwatch-container">
    <div id="stopwatch-display">00:00:00</div>
</div>

<a href="index.html" class="home-button">🏠 Home</a>

<h1>🏑 ELITE VISION TRAINER</h1>
<div id="level-progress">LEVEL 1 | Number: 1 / 8</div>

<div id="numberDisplay"></div>

<input type="number" id="inputBox" placeholder="?" autocomplete="off">

<div id="result"></div>

<div id="summary-overlay">
    <div class="summary-box">
        <h2 id="stat-title">YOUR STATS</h2>
        <p id="stat-details"></p>
        <button id="next-btn" class="next-btn" onclick="nextLevel()">NEXT LEVEL</button>
    </div>
</div>

<script>
let level = 1;
let roundInLevel = 0;
let correctInLevel = 0;
let currentNumber = "";
let displayTime = 300; // Start at 300ms as requested
let inputStartTime = 0;

// Stopwatch Logic
let startTime = Date.now();
setInterval(() => {
    let elapsed = Date.now() - startTime;
    let ms = Math.floor((elapsed % 1000) / 8);
    let s = Math.floor((elapsed / 1000) % 60);
    let m = Math.floor((elapsed / (1000 * 60)) % 60);
    document.getElementById("stopwatch-display").textContent = 
        `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}:${ms.toString().padStart(2,'0')}`;
}, 8);

// --- UPDATED DIGIT LOGIC ---
function generateNumber() {
    let minDigits, maxDigits;
    
    if (level <= 2) {
        minDigits = 1;
        maxDigits = 2;
    } else if (level <= 4) {
        minDigits = 1;
        maxDigits = 3;
    } else {
        minDigits = 2;
        maxDigits = 4;
    }
    
    const numDigits = Math.floor(Math.random() * (maxDigits - minDigits + 1)) + minDigits;
    let num = "";
    for(let i=0; i<numDigits; i++) num += Math.floor(Math.random()*8);
    return num;
}

function startRound() {
    if (roundInLevel >= 8) {
        showLevelSummary();
        return;
    }

    roundInLevel++;
    document.getElementById("level-progress").textContent = `LEVEL ${level} | Number: ${roundInLevel} / 8`;
    document.getElementById("result").textContent = "";
    document.getElementById("inputBox").value = "";
    document.getElementById("inputBox").style.display = "none";

    currentNumber = generateNumber();
    const display = document.getElementById("numberDisplay");
    display.textContent = currentNumber;
    
    // Random position within safe screen area
    const pad = 200;
    const maxX = window.innerWidth - pad;
    const maxY = window.innerHeight - pad;
    display.style.left = (Math.random() * maxX + pad/4) + "px";
    display.style.top = (Math.random() * maxY + pad/2) + "px";

    setTimeout(() => {
        display.textContent = "";
        document.getElementById("inputBox").style.display = "inline-block";
        document.getElementById("inputBox").focus();
        inputStartTime = Date.now();
    }, displayTime);
}

document.getElementById("inputBox").addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkAnswer();
});

function checkAnswer() {
    if (document.getElementById("inputBox").style.display === "none") return;

    const userVal = document.getElementById("inputBox").value;
    const resultEl = document.getElementById("result");
    
    if (userVal === currentNumber) {
        correctInLevel++;
        resultEl.textContent = "✔ CLEAN TOUCH";
        resultEl.style.color = "#00ffcc";
    } else {
        resultEl.textContent = `✘ TURNOVER (Was ${currentNumber})`;
        resultEl.style.color = "#ff4444";
    }

    // Extended review time (1.2s) to see the result clearly
    setTimeout(startRound, 1200); 
}

function showLevelSummary() {
    const overlay = document.getElementById("summary-overlay");
    const details = document.getElementById("stat-details");
    const title = document.getElementById("stat-title");
    const btn = document.getElementById("next-btn");

    overlay.style.display = "flex";
    const accuracy = correctInLevel * 8;
    const pass = correctInLevel >= 6;

    if (pass) {
        title.textContent = "LEVEL COMPLETE";
        title.style.color = "#00ffcc";
        details.innerHTML = `Score: ${correctInLevel}/8<br>Accuracy: ${accuracy}%<br>Speed: ${displayTime}ms<br><br><b>Status: PROMOTED</b>`;
        btn.textContent = "START LEVEL " + (level + 1);
    } else {
        title.textContent = "LEVEL FAILED";
        title.style.color = "#ff4444";
        details.innerHTML = `Score: ${correctInLevel}/8<br>Accuracy: ${accuracy}%<br><br><i>Min. Required: 6/8 to advance.</i>`;
        btn.textContent = "RETRY LEVEL " + level;
    }
}

function nextLevel() {
    if (correctInLevel >= 8) {
        level++;
        // Reduces by 20ms per level passed to make it gradual
        displayTime = Math.max(50, displayTime - 20); 
    }
    
    // Reset round counters
    roundInLevel = 0;
    correctInLevel = 0;
    document.getElementById("summary-overlay").style.display = "none";
    startRound();
}

// Initial start
startRound();
</script>
</body>
</html>
